name: Java CI

on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout source code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0
    - name: Set up JDK 17
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520   # v5.4.0
      with:
        distribution: ${{ matrix.distribution || 'temurin' }}
        java-version: '17'
    - name: Build with Maven
      run: ./mvnw clean package --batch-mode
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
